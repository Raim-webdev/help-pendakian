<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help Pendaki - Plan Your Mountain Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* CSS Variables - Design System */
    :root {
      --color-primary: #1E3A5F;
      --color-on-primary: #FFFFFF;
      --color-secondary: #2563EB;
      --color-on-secondary: #FFFFFF;
      --color-accent: #059669;
      --color-on-accent: #000000;
      --color-background: #F8FAFC;
      --color-foreground: #0F172A;
      --color-card: #FFFFFF;
      --color-card-foreground: #0F172A;
      --color-muted: #F1F3F5;
      --color-muted-foreground: #475569;
      --color-border: #E4E7EB;
      --color-destructive: #DC2626;
      --color-on-destructive: #FFFFFF;
      --color-ring: #1E3A5F;
      
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
      --space-2xl: 3rem;
      --space-3xl: 4rem;
      
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
      --shadow-xl: 0 20px 25px rgba(0,0,0,0.15);
      
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Work Sans', sans-serif;
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --color-background: #0F172A;
        --color-foreground: #F8FAFC;
        --color-card: #1E293B;
        --color-card-foreground: #F8FAFC;
        --color-muted: #334155;
        --color-muted-foreground: #94A3B8;
        --color-border: #334155;
      }
    }

    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--color-background);
      color: var(--color-foreground);
      line-height: 1.6;
      min-height: 100vh;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-heading);
      font-weight: 600;
      line-height: 1.2;
    }

    a {
      color: var(--color-primary);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Layout */
    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--space-md);
    }

    /* Header */
    .header {
      padding: var(--space-lg) 0;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: var(--space-xl);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-primary);
    }

    .logo span {
      color: var(--color-accent);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 200ms ease;
      border: none;
      font-family: var(--font-body);
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--color-accent);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
      text-decoration: none;
    }

    .btn-secondary {
      background: transparent;
      color: var(--color-primary);
      border: 2px solid var(--color-primary);
    }

    .btn-secondary:hover {
      background: var(--color-primary);
      color: white;
      text-decoration: none;
    }

    .btn-ghost {
      background: transparent;
      color: var(--color-muted-foreground);
      padding: 8px 16px;
    }

    .btn-ghost:hover {
      color: var(--color-foreground);
      background: var(--color-muted);
      text-decoration: none;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: var(--space-3xl) var(--space-md);
      margin-bottom: var(--space-2xl);
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      margin-bottom: var(--space-md);
      color: var(--color-primary);
    }

    .hero p {
      font-size: 1.2rem;
      color: var(--color-muted-foreground);
      max-width: 600px;
      margin: 0 auto var(--space-xl);
    }

    /* Search */
    .search-container {
      max-width: 600px;
      margin: 0 auto var(--space-2xl);
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 16px 24px;
      padding-left: 48px;
      border: 2px solid var(--color-border);
      border-radius: var(--radius-xl);
      font-size: 1rem;
      font-family: var(--font-body);
      background: var(--color-card);
      color: var(--color-foreground);
      transition: border-color 200ms ease, box-shadow 200ms ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-muted-foreground);
      pointer-events: none;
    }

    /* Panels */
    .panels {
      display: flex;
      gap: var(--space-md);
      justify-content: center;
      margin-bottom: var(--space-2xl);
      flex-wrap: wrap;
    }

    .panel-btn {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: 12px 20px;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all 200ms ease;
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--color-foreground);
    }

    .panel-btn:hover {
      border-color: var(--color-primary);
      box-shadow: var(--shadow-md);
    }

    .panel-btn.active {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }

    /* Panel Content */
    .panel-content {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      margin-bottom: var(--space-2xl);
      display: none;
    }

    .panel-content.active {
      display: block;
    }

    .panel-content h2 {
      margin-bottom: var(--space-md);
      color: var(--color-primary);
    }

    /* Mountain List */
    .mountains-section {
      margin-bottom: var(--space-3xl);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-lg);
    }

    .section-header h2 {
      font-size: 1.5rem;
    }

    .mountain-count {
      color: var(--color-muted-foreground);
      font-size: 0.9rem;
    }

    .mountain-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--space-lg);
    }

    /* Mountain Card */
    .mountain-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      transition: all 200ms ease;
      cursor: pointer;
    }

    .mountain-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
      border-color: var(--color-primary);
    }

    .mountain-card h3 {
      font-size: 1.25rem;
      margin-bottom: var(--space-sm);
      color: var(--color-primary);
    }

    .mountain-meta {
      display: flex;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
      font-size: 0.9rem;
      color: var(--color-muted-foreground);
    }

    .mountain-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .mountain-description {
      color: var(--color-muted-foreground);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: var(--space-md);
    }

    .mountain-tags {
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    .tag {
      padding: 4px 12px;
      background: var(--color-muted);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      color: var(--color-muted-foreground);
    }

    .tag-difficulty-easy {
      background: #D1FAE5;
      color: #065F46;
    }

    .tag-difficulty-moderate {
      background: #FEF3C7;
      color: #92400E;
    }

    .tag-difficulty-hard {
      background: #FEE2E2;
      color: #991B1B;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: var(--space-2xl) var(--space-md);
      border-top: 1px solid var(--color-border);
      color: var(--color-muted-foreground);
      font-size: 0.9rem;
    }

    /* Loading & Error States */
    .loading {
      text-align: center;
      padding: var(--space-3xl);
      color: var(--color-muted-foreground);
    }

    .error {
      text-align: center;
      padding: var(--space-3xl);
    }

    .error h2 {
      color: var(--color-destructive);
      margin-bottom: var(--space-md);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .mountain-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: var(--space-xl) var(--space-md);
      }

      .panels {
        flex-direction: column;
        align-items: stretch;
      }

      .panel-btn {
        justify-content: center;
      }
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Focus visible */
    :focus-visible {
      outline: 2px solid var(--color-ring);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <a href="#/" class="logo">Help <span>Pendaki</span></a>
      </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-container">
      <!-- Content will be rendered by router -->
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p> Help Pendaki. Plan your adventure safely.</p>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
